name: Hämta taxeområden

on:
  schedule:
    - cron: '0 3 1 * *'   # Kl 03:00 den 1:a varje månad
  workflow_dispatch:      # Går även att köra manuellt

jobs:
  fetch-taxa:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repo
        uses: actions/checkout@v4

      - name: Sätt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Hämta taxeområden från Trafikkontorets WFS
        run: |
          python3 scripts/fetch_taxa.py \
            "${{ secrets.TRAFIKKONTORET_API_KEY }}" \
            data/taxeomraden.geojson

      - name: Committa och pusha om något ändrats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/taxeomraden.geojson
          git diff --staged --quiet || git commit -m "Uppdatera taxeområden $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
