name: Uppdatera produktfeed

on:
  schedule:
    - cron: '0 4 * * *'   # Varje natt kl 04:00 UTC
  workflow_dispatch:

jobs:
  fetch-products:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repo
        uses: actions/checkout@v4

      - name: Sätt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Hämta och konvertera produktfeed
        run: |
          python3 scripts/build_products.py \
            "${{ secrets.ADTRACTION_FEED_URL }}" \
            data/produkter.json

      - name: Committa och pusha
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/produkter.json
          git diff --staged --quiet || git commit -m "Uppdatera produktfeed $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
